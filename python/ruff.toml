# Ruff configuration for the Python style guide in this directory.
# Copy into a project as ruff.toml, or under [tool.ruff] in pyproject.toml.

target-version = "py311"
line-length = 100

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # modern syntax for the target version
    "B",    # likely bugs
    "SIM",  # simplifications
    "ANN",  # type annotations, including ANN401 (no Any)
    "D",    # docstrings, Google convention below
    "FA",   # from __future__ import annotations
    "N",    # pep8-naming, minus the rules the naming section overrides
    "RUF",  # ruff-specific
]
ignore = [
    "N802",  # function names: RPN subject_action uses a lowerCamelCase subject
    "N803",  # argument names are lowerCamelCase
    "N806",  # local variables are lowerCamelCase
    "N815",  # class-scope fields are lowerCamelCase
    "N816",  # module-scope variables are lowerCamelCase
]

[lint.pydocstyle]
convention = "google"

[lint.isort]
required-imports = ["from __future__ import annotations"]
