name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guides:
    name: Guides share one outline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/guides_compare.py python/STYLE-GUIDE.md typescript/STYLE-GUIDE.md

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.6
      - run: ruff check .
      - run: ruff format --check .
      - run: python python/rpn_check.py python scripts
      - run: python -m doctest -v example/transcript.py rpn_check.py
        working-directory: python
      - run: python -m doctest -v scripts/guides_compare.py

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - run: npm run check
